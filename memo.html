<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>默契 · 記憶</title>
<meta name="theme-color" content="#111318">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#111318;--card:#1a1d23;--line:#2a2f38;--fg:#e8eaee;--dim:#8b929e;--accent:#7cd6b6}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;font-size:16px;line-height:1.6;padding:env(safe-area-inset-top) 16px calc(110px + env(safe-area-inset-bottom));min-height:100vh}
header{padding:24px 4px 6px}
header h1{margin:0;font-size:26px;letter-spacing:.12em;color:var(--accent)}
header p{margin:2px 0 0;color:var(--dim);font-size:13px;letter-spacing:.08em}
.bar{display:flex;gap:8px;padding:12px 0}
.bar button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#1a1d23;color:var(--fg);font-size:14px;font-family:inherit}
.bar button:active{background:#23272f}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:12px}
.card:active{background:#20242b}
.chip{display:inline-block;background:#243a33;color:var(--accent);font-size:11px;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0;color:var(--dim);font-size:14px;white-space:pre-wrap}
.empty{color:var(--dim);text-align:center;margin:40px 0;line-height:2}
#add{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:15px;border:0;border-radius:14px;background:var(--accent);color:#0d1a15;font-size:16px;font-weight:700;font-family:inherit}
#editor,#import{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:10}
.sheet{width:100%;max-height:92vh;overflow:auto;background:#171a20;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet h2{margin:0 0 12px;font-size:18px}
.sheet label{display:block;margin-bottom:12px;font-size:13px;color:var(--dim)}
.sheet input,.sheet textarea{width:100%;margin-top:6px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0d0f13;color:var(--fg);font-size:16px;font-family:inherit;resize:vertical}
.sheet input:focus,.sheet textarea:focus{outline:none;border-color:var(--accent)}
.hint{color:var(--dim);font-size:12px;margin:0 0 10px;line-height:1.6}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;padding:13px;border:0;border-radius:12px;font-size:15px;font-family:inherit;background:var(--accent);color:#0d1a15;font-weight:700}
.row .danger{background:#3a2226;color:#ff8f8f}
.row .ghost{background:#242830;color:var(--fg)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#2b303a;color:var(--fg);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header><h1>記憶</h1><p>我看得見的那一份</p></header>
<div class="bar">
<button id="btnCopy">複製全部</button>
<button id="btnImport">貼上匯入</button>
</div>
<main id="list"></main>
<button id="add">＋ 新增記憶</button>
<div id="editor" style="display:none">
<div class="sheet">
<h2 id="etitle">新增記憶</h2>
<label>標題<input id="f-title" placeholder="例如：默契 App 專案"></label>
<label>分類<input id="f-cat" placeholder="例如：專案 / 偏好 / 背景"></label>
<label>內容<textarea id="f-body" rows="8"></textarea></label>
<div class="row">
<button id="save">儲存</button>
<button id="del" class="danger">刪除</button>
<button id="cancel" class="ghost">取消</button>
</div>
</div>
</div>
<div id="import" style="display:none">
<div class="sheet">
<h2>貼上匯入</h2>
<p class="hint">每則之間用一行 --- 隔開，第一行寫【分類】標題。同樣標題會覆蓋舊的。</p>
<textarea id="f-import" rows="10" placeholder="【專案】默契 App&#10;內容…&#10;---&#10;【偏好】回話方式&#10;內容…"></textarea>
<div class="row">
<button id="doImport">匯入</button>
<button id="importCancel" class="ghost">取消</button>
</div>
</div>
</div>
<div id="toast"></div>
<script>
(function(){
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
var KEY='moqi.memo.v1';
var OLD='moqi.personas.v1';
var items=[];
try{ items=JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ items=[]; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(m){
var t=$('toast'); t.textContent=m; t.className='on';
clearTimeout(t._t); t._t=setTimeout(function(){ t.className=''; },1800);
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(items)); }catch(e){ toast('儲存失敗'); } }
if(!items.length){
try{
var old=JSON.parse(localStorage.getItem(OLD))||[];
old.forEach(function(p){
var b=[];
if(p.rel) b.push('關係：'+p.rel);
if(p.tone) b.push('說話方式：'+p.tone);
if(p.like) b.push('在意的事：'+p.like);
if(p.note) b.push('備註：'+p.note);
items.push({title:p.name||'未命名',cat:'人設',body:b.join('\n')});
});
}catch(e){}
if(items.length) save();
}
var cur=null;
function render(){
var box=$('list');
if(!items.length){
box.innerHTML='<p class="empty">還沒有記憶。<br>按「貼上匯入」把整理好的內容貼進來。</p>';
return;
}
var h='';
items.forEach(function(it,i){
h+='<article class="card" data-i="'+i+'">'
+(it.cat?'<span class="chip">'+esc(it.cat)+'</span>':'')
+'<h3>'+esc(it.title)+'</h3>'
+(it.body?'<p>'+esc(it.body)+'</p>':'')
+'</article>';
});
box.innerHTML=h;
var cards=box.querySelectorAll('.card');
for(var i=0;i<cards.length;i++){
cards[i].onclick=function(){ openEditor(Number(this.getAttribute('data-i'))); };
}
}
function openEditor(i){
cur=i;
var it=(i===null)?{}:items[i];
$('etitle').textContent=(i===null)?'新增記憶':'編輯';
$('f-title').value=it.title||'';
$('f-cat').value=it.cat||'';
$('f-body').value=it.body||'';
$('del').style.display=(i===null)?'none':'';
$('del').textContent='刪除';
$('del').removeAttribute('data-armed');
$('editor').style.display='flex';
}
function closeEditor(){ $('editor').style.display='none'; cur=null; }
$('add').onclick=function(){ openEditor(null); };
$('cancel').onclick=closeEditor;
$('save').onclick=function(){
var it={title:$('f-title').value.trim(),cat:$('f-cat').value.trim(),body:$('f-body').value.trim()};
if(!it.title){ toast('先填標題'); return; }
if(cur===null){ items.push(it); } else { items[cur]=it; }
save(); render(); closeEditor(); toast('已儲存');
};
$('del').onclick=function(){
if(cur===null) return;
var btn=$('del');
if(!btn.getAttribute('data-armed')){
btn.setAttribute('data-armed','1'); btn.textContent='再按一次';
setTimeout(function(){ if(btn.getAttribute('data-armed')){ btn.removeAttribute('data-armed'); btn.textContent='刪除'; } },2500);
return;
}
items.splice(cur,1); save(); render(); closeEditor(); toast('已刪除');
};
$('editor').onclick=function(e){ if(e.target && e.target.id==='editor') closeEditor(); };
function toText(){
return items.map(function(it){
return (it.cat?'【'+it.cat+'】':'')+it.title+'\n'+(it.body||'');
}).join('\n\n---\n\n');
}
function fallbackCopy(t){
var ta=document.createElement('textarea');
ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
document.body.appendChild(ta); ta.select();
try{ document.execCommand('copy'); toast('已複製'); }catch(e){ toast('複製失敗，請長按選取內容'); }
document.body.removeChild(ta);
}
$('btnCopy').onclick=function(){
var t=toText();
if(navigator.clipboard && navigator.clipboard.writeText){
navigator.clipboard.writeText(t).then(function(){ toast('已複製 '+items.length+' 則'); },function(){ fallbackCopy(t); });
} else { fallbackCopy(t); }
};
$('btnImport').onclick=function(){ $('import').style.display='flex'; };
$('importCancel').onclick=function(){ $('import').style.display='none'; };
$('import').onclick=function(e){ if(e.target && e.target.id==='import') $('import').style.display='none'; };
function parseBlocks(txt){
var parts=txt.split(/^[ \t]*---+[ \t]*$/m);
var out=[];
parts.forEach(function(block){
block=block.replace(/^\s+/,'').replace(/\s+$/,'');
if(!block) return;
var lines=block.split('\n');
var first=lines.shift()||'';
var cat='';
var m=first.match(/^【(.+?)】\s*(.*)$/);
if(m){ cat=m[1]; first=m[2]; }
out.push({title:(first||'').trim()||'未命名',cat:cat.trim(),body:lines.join('\n').replace(/\s+$/,'')});
});
return out;
}
$('doImport').onclick=function(){
var parsed=parseBlocks($('f-import').value);
if(!parsed.length){ toast('沒有讀到內容'); return; }
parsed.forEach(function(p){
var found=null;
for(var i=0;i<items.length;i++){ if(items[i].title===p.title){ found=items[i]; break; } }
if(found){ found.cat=p.cat; found.body=p.body; } else { items.push(p); }
});
save(); render();
$('f-import').value=''; $('import').style.display='none';
toast('匯入 '+parsed.length+' 則');
};
render();
})();
</script>
</body>
</html>
